name: image

# Builds the openEMS GPU image and pushes ghcr.io/<owner>/openems-gpu:<git sha> and :latest.
on:
  push:
    branches: [main]
    paths: [Dockerfile, docker/**, .github/workflows/image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      # The CUDA devel image, the build dependencies and the build need about 25 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/openems-gpu:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/openems-gpu:latest
          # keeps the build stage, so a change to docker/*.sh rebuilds only the last layers
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build info
        run: docker run --rm --entrypoint cat ghcr.io/${{ github.repository_owner }}/openems-gpu:${{ github.sha }} /opt/openEMS/BUILD-INFO.txt
